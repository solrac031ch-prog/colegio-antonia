name: Repair challenge freezes v26

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-challenges-v26.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair challenge engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          games = Path('games.js')
          text = games.read_text()

          old = "let P=load(),active=Math.max(1,Number(P.challengeUnlocked[sk])||1),session=[],ri=0,score=0,earned=0,attempt=0,locked=false,orderSel=[],matchState=null,transitioning=false,matchBusy=false;"
          new = "let P=load(),active=Math.max(1,Number(P.challengeUnlocked[sk])||1),session=[],ri=0,score=0,earned=0,attempt=0,locked=false,orderSel=[],matchState=null,transitioning=false,matchBusy=false,matchTimer=null;"
          if old not in text and new not in text:
              raise SystemExit('State declaration not found')
          text = text.replace(old, new)

          old_choice = "let g=document.createElement('div');g.className=`quick-choice-grid${a.visual?' visual':''}`,frag=document.createDocumentFragment();"
          new_choice = "let g=document.createElement('div'),frag=document.createDocumentFragment();g.className=`quick-choice-grid${a.visual?' visual':''}`;"
          if old_choice not in text and new_choice not in text:
              raise SystemExit('renderChoice declaration not found')
          text = text.replace(old_choice, new_choice)

          old_clear = "function clear(){E.content.replaceChildren();E.feedback.replaceChildren();E.feedback.className='quick-feedback';E.check.classList.add('hidden');E.next.classList.add('hidden');E.check.disabled=false;E.next.disabled=false;orderSel=[];matchState=null;matchBusy=false}"
          new_clear = "function clearMatchTimer(){if(matchTimer){clearTimeout(matchTimer);matchTimer=null}}\nfunction clear(){clearMatchTimer();E.content.replaceChildren();E.feedback.replaceChildren();E.feedback.className='quick-feedback';E.check.classList.add('hidden');E.next.classList.add('hidden');E.check.disabled=false;E.next.disabled=false;orderSel=[];matchState=null;matchBusy=false}"
          if old_clear in text:
              text = text.replace(old_clear, new_clear)
          elif 'function clearMatchTimer()' not in text:
              raise SystemExit('clear function not found')

          replacement = r'''function setMatchBusy(g,busy){matchBusy=busy;g.setAttribute('aria-busy',busy?'true':'false');g.querySelectorAll('.quick-match-card').forEach(card=>{if(busy){if(!card.disabled){card.disabled=true;card.dataset.matchTempDisabled='1'}}else if(card.dataset.matchTempDisabled==='1'){card.disabled=false;delete card.dataset.matchTempDisabled}})}
function renderMatch(a){clearMatchTimer();let cards=[];a.pairs.forEach((p,pi)=>p.forEach((x,side)=>cards.push({x,pi,side})));matchState={sel:null,done:new Set};matchBusy=false;let g=document.createElement('div'),frag=document.createDocumentFragment();g.className='quick-match-grid';g.setAttribute('aria-busy','false');sh(cards).forEach(card=>{let b=document.createElement('button');b.type='button';b.className='quick-match-card';b.textContent=card.x;b.onclick=()=>{if(b.disabled||locked||transitioning||matchBusy)return;if(!matchState.sel){matchState.sel={card,b};b.classList.add('selected');return}let z=matchState.sel;if(z.b===b){b.classList.remove('selected');matchState.sel=null;return}if(z.card.pi===card.pi&&z.card.side!==card.side){z.b.classList.remove('selected');z.b.classList.add('matched');b.classList.add('matched');z.b.disabled=b.disabled=true;matchState.done.add(card.pi);matchState.sel=null;if(matchState.done.size===a.pairs.length){locked=true;award();fb('success',T.pairs,a.explanation);E.next.classList.remove('hidden')}}else{z.b.classList.remove('selected');z.b.classList.add('wrong');b.classList.add('wrong');matchState.sel=null;setMatchBusy(g,true);matchTimer=setTimeout(()=>{matchTimer=null;if(!g.isConnected){matchBusy=false;return}z.b.classList.remove('wrong');b.classList.remove('wrong');setMatchBusy(g,false)},260)}};frag.appendChild(b)});g.appendChild(frag);E.content.appendChild(g)}
function speak'''
          pattern = r"function renderMatch\(a\)\{.*?\}\nfunction speak"
          if not re.search(pattern, text, flags=re.S):
              if 'function setMatchBusy(g,busy)' not in text:
                  raise SystemExit('renderMatch block not found')
          else:
              text = re.sub(pattern, replacement, text, count=1, flags=re.S)

          games.write_text(text)

          html = Path('games.html')
          h = html.read_text()
          h = h.replace('  <script>var frag;</script>\n', '')
          h = h.replace('games.js?v=25', 'games.js?v=26')
          html.write_text(h)

          sw = Path('sw.js')
          s = sw.read_text()
          s = s.replace('aprende-3-basico-v23-progressive-v24-performance-v25', 'aprende-3-basico-v23-progressive-v24-performance-v26')
          s = s.replace('// v25: networkFirst', '// v26: networkFirst')
          sw.write_text(s)

          wf = Path('.github/workflows/pages.yml')
          w = wf.read_text()
          w = w.replace("grep -q 'games.js?v=25' games.html", "grep -q 'games.js?v=26' games.html")
          w = w.replace("grep -q 'performance-v25' sw.js", "grep -q 'performance-v26' sw.js")
          if "grep -q 'matchTimer' games.js" not in w:
              w = w.replace("          grep -q 'matchBusy' games.js\n", "          grep -q 'matchBusy' games.js\n          grep -q 'matchTimer' games.js\n          grep -q \"aria-busy\" games.js\n          ! grep -q '<script>var frag;</script>' games.html\n")
          wf.write_text(w)

          test = Path('tests/progressive-challenges.spec.mjs')
          t = test.read_text()
          marker = "English matching recovers after a wrong pair"
          if marker not in t:
              t += r'''

test('English matching recovers after a wrong pair', async ({ page }) => {
  test.setTimeout(60_000);
  const pageErrors = [];
  page.on('pageerror', error => pageErrors.push(error.message));

  await page.goto('/games.html?subject=english', { waitUntil: 'domcontentloaded' });
  let foundMatch = false;

  for (let round = 0; round < 5; round += 1) {
    const grid = page.locator('.quick-match-grid');
    if (await grid.count()) {
      foundMatch = true;
      const dog = page.getByRole('button', { name: 'dog', exact: true });
      const wrongPicture = page.getByRole('button', { name: '🐦', exact: true });

      await dog.click();
      await wrongPicture.click();
      await expect(grid).toHaveAttribute('aria-busy', 'true', { timeout: 1_000 });
      await expect(dog).toBeDisabled();
      await expect(wrongPicture).toBeDisabled();
      await expect(grid).toHaveAttribute('aria-busy', 'false', { timeout: 2_000 });
      await expect(dog).toBeEnabled();
      await expect(wrongPicture).toBeEnabled();
      break;
    }

    await finishRound(page);
    await page.locator('[data-quick-next]').click();
  }

  expect(foundMatch).toBeTruthy();
  expect(pageErrors).toEqual([]);
});
'''
          test.write_text(t)
          PY

          node --check games.js
          node --check sw.js
          node --check tests/progressive-challenges.spec.mjs

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.js games.html sw.js .github/workflows/pages.yml tests/progressive-challenges.spec.mjs
          git commit -m "Fix challenge freezes and cache v26"
          git push origin main
