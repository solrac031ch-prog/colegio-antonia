name: Publicar Aprende 3° Básico

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check english.js
          node --check language.js
          node --check science.js
          node --check history.js
          node --check feedback-enhancer.js
          node --check game-progress.js
          node --check games.js
          node --check progress-controls.js
          node --check sw.js
          node --check playwright.config.mjs
          node --check tests/smoke.spec.mjs

      - name: Validar estructura del sitio
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html math.html english.html language.html science.html history.html games.html styles.css curriculum.css english.css platform.css adventure.css dashboard.css games.css feedback-enhancer.js game-progress.js games.js manifest.webmanifest logo-3basico.svg package.json playwright.config.mjs tests/smoke.spec.mjs; do
            test -f "$file"
          done
          grep -q 'dashboard.css?v=19' index.html
          grep -q 'adventure.css?v=19' index.html
          grep -q 'games.css?v=19' index.html
          grep -q 'game-progress.js?v=19' index.html
          grep -q 'games.html?subject=math' index.html
          grep -q 'math.html?v=19' index.html
          grep -q 'app.js?v=19' math.html
          grep -q 'english.js?v=19' english.html
          grep -q 'language.js?v=19' language.html
          grep -q 'science.js?v=19' science.html
          grep -q 'history.js?v=19' history.html
          grep -q 'games.js?v=19' games.html
          grep -q 'games.css?v=19' games.html
          grep -q 'speechSynthesis' games.js
          grep -q "type: 'listen'" games.js
          grep -q "type: 'order'" games.js
          grep -q "type: 'match'" games.js
          grep -q "type: 'fill'" games.js
          grep -q "type: 'truefalse'" games.js
          for page in math.html english.html language.html science.html history.html; do
            grep -q 'progress-controls.js?v=19' "$page"
            grep -q 'game-progress.js?v=19' "$page"
            grep -q 'platform.css?v=19' "$page"
            grep -q 'adventure.css?v=19' "$page"
            grep -q 'games.css?v=19' "$page"
            grep -q 'games.html?subject=' "$page"
            grep -q 'data-app-back' "$page"
            grep -q 'aria-current="page"' "$page"
            grep -q 'data-subject=' "$page"
            grep -q 'Aprende 3° Básico' "$page"
          done
          for page in language.html science.html history.html; do
            grep -q 'feedback-enhancer.js?v=19' "$page"
          done
          grep -q 'logo-3basico.svg?v=19' index.html
          grep -q "aprende-3-basico-v19" sw.js
          grep -q "./games.html" sw.js
          grep -q "./games.js" sw.js
          grep -q "./games.css" sw.js
          ! grep -q 'Colegio de Antonia\|Colegio Antonia' index.html math.html english.html language.html science.html history.html games.html manifest.webmanifest
          ! grep -q 'hotfix.js\|quiz-sync.js' math.html sw.js

      - name: Validar JSON
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool package.json > /dev/null

  browser-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar pruebas
        run: npm install --no-audit --no-fund

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: Probar Windows Android e iOS
        run: npm run test:e2e

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [validate, browser-test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
