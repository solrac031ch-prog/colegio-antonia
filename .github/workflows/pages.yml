name: Publicar Aprende 3° Básico

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check english.js
          node --check language.js
          node --check science.js
          node --check history.js
          node --check feedback-enhancer.js
          node --check game-progress.js
          node --check games.js
          node --check voice.js
          node --check progress-controls.js
          node --check sw.js
          node --check playwright.config.mjs
          node --check tests/smoke.spec.mjs
          node --check tests/voice-learning.spec.mjs

      - name: Validar estructura del sitio
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html math.html english.html language.html science.html history.html games.html styles.css curriculum.css english.css platform.css adventure.css dashboard.css games.css voice.css feedback-enhancer.js game-progress.js games.js voice.js manifest.webmanifest logo-3basico.svg package.json playwright.config.mjs tests/smoke.spec.mjs tests/voice-learning.spec.mjs; do
            test -f "$file"
          done

          grep -q 'game-progress.js?v=22' index.html
          grep -q 'progress-controls.js?v=22' index.html
          grep -q 'data-reset-all-progress' index.html
          grep -q 'math.html?v=22' index.html
          grep -q 'english.html?v=22' index.html

          grep -q '<html lang="en">' english.html
          grep -q 'Learn Grade 3' english.html
          grep -q 'english.js?v=22' english.html
          grep -q 'game-progress.js?v=22' english.html
          grep -q 'voice.js?v=23' english.html
          grep -q 'progress-controls.js?v=22' english.html
          grep -q 'voice.css?v=23' english.html
          grep -q 'Reset English progress' english.html
          grep -q 'English quick challenge' english.html
          ! grep -Eq '← Materias|Modo aventura|⭐ Estrellas|Sesiones de Inglés|Mejor racha|Reiniciar progreso|Camino de Inglés|Tu ruta de aprendizaje|6 estaciones|Elige la mejor|Lee y responde' english.html
          ! grep -Eq '¿|¡|significa|Con she|Con he|Con they|Con we|Completa la oración|Elige la|Lee y responde|pregunta cómo|respuesta natural' english.js

          for page in math.html language.html science.html history.html; do
            grep -q 'game-progress.js?v=22' "$page"
            grep -q 'voice.js?v=22' "$page"
            grep -q 'voice.css?v=22' "$page"
            grep -q 'progress-controls.js?v=22' "$page"
            grep -q 'games.html?subject=' "$page"
            grep -q 'data-app-back' "$page"
            grep -q 'aria-current="page"' "$page"
          done

          grep -q 'voice.js?v=23' games.html
          grep -q 'voice.css?v=23' games.html
          grep -q 'games.js?v=22' games.html
          grep -q 'progress-controls.js?v=22' games.html
          grep -q "type:'listen'" games.js
          grep -q "type:'order'" games.js
          grep -q "type:'match'" games.js
          grep -q "type:'fill'" games.js
          grep -q "type:'truefalse'" games.js
          grep -q 'Match each word with its picture' games.js
          grep -q 'challengeUnlocked' games.js
          grep -q 'challengeCompleted' games.js
          grep -q 'data-quick-next-challenge' games.html
          grep -q 'Animals' games.js
          grep -q 'Transport' games.js
          grep -q 'Positions' games.js
          grep -q 'School & lunchbox' games.js

          grep -q 'premium' voice.js
          grep -q 'enhanced' voice.js
          grep -q 'natural' voice.js
          grep -q "'en-US'" voice.js
          grep -q "'es-CL'" voice.js
          grep -q '0.84' voice.js
          grep -q '0.9' voice.js
          grep -q '0.72' voice.js
          grep -q '0.66' voice.js
          grep -q 'Repeat slowly' voice.js
          grep -q 'Repeat explanation slowly' voice.js
          grep -q 'voiceschanged' voice.js
          grep -q 'data-voice-english-slow' tests/voice-learning.spec.mjs

          ! grep -q 'registration.update()' progress-controls.js
          grep -q 'requestIdleCallback' progress-controls.js
          grep -q "aprende-3-basico-v23" sw.js
          grep -q 'staleWhileRevalidate' sw.js
          grep -q "./voice.js" sw.js
          grep -q "./voice.css" sw.js
          grep -q "./games.js" sw.js

          ! grep -q 'Colegio de Antonia\|Colegio Antonia' index.html math.html english.html language.html science.html history.html games.html manifest.webmanifest
          ! grep -q 'hotfix.js\|quiz-sync.js' math.html sw.js

      - name: Validar JSON
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool package.json > /dev/null

  browser-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar pruebas
        run: npm install --no-audit --no-fund

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: Probar Windows Android e iOS
        run: npm run test:e2e

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [validate, browser-test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
