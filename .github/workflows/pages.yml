name: Publicar Colegio de Antonia

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check english.js
          node --check language.js
          node --check science.js
          node --check history.js
          node --check progress-controls.js
          node --check sw.js

      - name: Validar estructura del sitio
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html english.html language.html science.html history.html styles.css curriculum.css english.css manifest.webmanifest logo-antonia.svg; do test -f "$file"; done
          grep -q 'app.js?v=15' index.html
          grep -q 'english.js?v=15' english.html
          grep -q 'language.js?v=15' language.html
          grep -q 'science.js?v=15' science.html
          grep -q 'history.js?v=15' history.html
          for page in index.html english.html language.html science.html history.html; do
            grep -q 'progress-controls.js?v=15' "$page"
            grep -q 'data-app-back' "$page"
          done
          grep -q 'science.html?v=15' index.html
          grep -q 'history.html?v=15' index.html
          ! grep -q 'hotfix.js\|quiz-sync.js' index.html
          ! grep -q 'hotfix.js\|quiz-sync.js' sw.js

      - name: Validar manifest
        run: python -m json.tool manifest.webmanifest > /dev/null

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
