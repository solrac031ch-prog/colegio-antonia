name: Publicar Colegio de Antonia

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check english.js
          node --check language.js
          node --check progress-controls.js
          node --check sw.js

      - name: Validar estructura del sitio
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f english.html
          test -f language.html
          test -f styles.css
          test -f curriculum.css
          test -f english.css
          test -f manifest.webmanifest
          test -f logo-antonia.svg
          grep -q 'app.js?v=14' index.html
          grep -q 'english.js?v=14' english.html
          grep -q 'language.js?v=14' language.html
          grep -q 'progress-controls.js?v=14' index.html
          grep -q 'progress-controls.js?v=14' english.html
          grep -q 'progress-controls.js?v=14' language.html
          grep -q 'language.html?v=14' index.html
          grep -q 'language.html?v=14' english.html
          grep -q 'data-app-back' index.html
          grep -q 'data-app-back' english.html
          grep -q 'data-app-back' language.html
          ! grep -q 'hotfix.js\|quiz-sync.js' index.html
          ! grep -q 'hotfix.js\|quiz-sync.js' sw.js

      - name: Validar manifest
        run: python -m json.tool manifest.webmanifest > /dev/null

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
